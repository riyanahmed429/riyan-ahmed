<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyan Ahmed - XTALI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:#000; color:white; text-align:center; overflow-x:hidden; }
.hero { min-height:100vh; background: url('bg.jpg') no-repeat center center/cover; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; }
.hero::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.45); }
.hero > * { position:relative; z-index:2; }
h1 { font-size:48px; text-shadow:0 0 20px #ff0055; }
p { margin:10px 0 20px; font-size:18px; }
.btn { background:#ff0055; color:white; border:none; padding:14px 30px; font-size:18px; border-radius:50px; cursor:pointer; font-weight:bold; box-shadow:0 0 20px #ff0055; }
.follow-box { background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.3); padding:15px 20px; border-radius:20px; margin:15px 0; }
.follow-count { font-size:22px; font-weight:bold; margin-bottom:10px; }
.follow-count span { color:#ff0055; font-size:26px; }
.follow-btn { background:#0095f6; color:white; border:none; padding:12px 35px; font-size:18px; border-radius:50px; cursor:pointer; font-weight:bold; }
.follow-btn.followed { background:#333; border:1px solid #555; }
.game-zone { background:#111; padding:30px 10px 40px; }
.game-zone h2 { font-size:28px; margin-bottom:5px; color:#00ff88; }
.game-zone p { font-size:14px; opacity:0.7; margin-bottom:15px; }
#gameBox { background:white; max-width:600px; height:180px; margin:0 auto; border-radius:12px; position:relative; overflow:hidden; }
canvas { width:100%; height:100%; display:block; }
#score { position:absolute; top:8px; right:12px; color:#333; font-weight:bold; }
#gameOver { position:absolute; inset:0; display:none; flex-direction:column; justify-content:center; align-items:center; background:rgba(255,255,255,0.85); color:#111; }
.jump-btn { margin-top:15px; background:#00ff88; color:#000; border:none; padding:12px 30px; font-size:18px; border-radius:50px; font-weight:bold; cursor:pointer; margin:5px; }
.mario-zone { background:#0a1a2e; padding:30px 10px 40px; }
.mario-zone h2 { color:#ffcc00; font-size:28px; }
#marioBox { background:#5cb6ff; max-width:600px; height:220px; margin:0 auto; border-radius:12px; position:relative; overflow:hidden; }
.ctrl { display:flex; justify-content:center; gap:10px; margin-top:12px; }
.ctrl button { background:#ffcc00; border:none; width:70px; height:55px; font-size:24px; border-radius:12px; font-weight:bold; }
/* PLAY OVERLAY */
.play-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.65); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; }
.play-overlay b { font-size:24px; margin-bottom:12px; color:white; }
.play-big { background:#ff0055; color:white; border:none; width:80px; height:80px; font-size:35px; border-radius:50%; cursor:pointer; box-shadow:0 0 25px #ff0055; }
.play-big:active { transform:scale(0.9); }
.mario-play { background:#ffcc00; color:#000; box-shadow:0 0 25px #ffcc00; }
</style>
</head>
<body>

<div class="hero">
  <h1>RIYAN AHMED</h1>
  <p>Welcome To My World ❤️</p>
  <div class="follow-box">
    <div class="follow-count">👥 <span id="followCount">1,250</span> Followers</div>
    <button id="followBtn" class="follow-btn" onclick="doFollow()">+ Follow</button>
    <div id="followMsg" style="font-size:13px; margin-top:8px; opacity:0.8;"></div>
  </div>
  <button class="btn" onclick="playMusic()">▶ PLAY XTALI</button>
  <audio id="myAudio" loop><source src="music.mp3" type="audio/mpeg"></audio>
  <p style="margin-top:20px; font-size:14px;">👇 Niche 2 ta Game Ase 👇</p>
</div>

<!-- GAME 1 DINO -->
<div class="game-zone">
  <h2>🎮 GAME 1 - DINO 🎮</h2>
  <p>PLAY chap diye suru kor!</p>
  <div id="gameBox">
    <canvas id="game" width="600" height="180"></canvas>
    <div id="score">Score: 0</div>
    <div id="gameOver"><b>Game Over! 😭</b><span id="finalScore"></span><button class="jump-btn" onclick="restartGame()">🔁 Abar Khel</button></div>
    <!-- DINO PLAY -->
    <div id="dinoPlay" class="play-overlay">
      <b>🦖 DINO GAME</b>
      <button class="play-big" onclick="startDino()">▶</button>
      <span style="margin-top:10px; font-size:14px; opacity:0.9;">Khelte PLAY chap de!</span>
    </div>
  </div>
  <button class="jump-btn" onclick="jump()">🦖 JUMP!</button>
</div>

<!-- GAME 2 MARIO -->
<div class="mario-zone">
  <h2>🍄 GAME 2 - SUPER RIYAN 🍄</h2>
  <p>PLAY chap diye suru kor! | Coin: <span id="coinCount">0</span></p>
  <div id="marioBox">
    <canvas id="mario" width="600" height="220"></canvas>
    <!-- MARIO PLAY -->
    <div id="marioPlay" class="play-overlay">
      <b>🍄 SUPER RIYAN</b>
      <button class="play-big mario-play" onclick="startMario()">▶</button>
      <span style="margin-top:10px; font-size:14px;">Khelte PLAY chap de!</span>
    </div>
  </div>
  <div class="ctrl">
    <button onclick="mLeft=true; setTimeout(()=>mLeft=false,200)">⬅️</button>
    <button onclick="mJump()">⬆️</button>
    <button onclick="mRight=true; setTimeout(()=>mRight=false,200)">➡️</button>
  </div>
  <button class="jump-btn" style="background:#ffcc00;" onclick="restartMario()">🔁 Abar Khel</button>
  <p id="marioMsg" style="margin-top:10px; color:#ffcc00; font-weight:bold;"></p>
</div>

<script>
function playMusic(){ var a=document.getElementById('myAudio'); if(a.paused) a.play(); else a.pause(); }
// FOLLOW
var baseFollowers = 1250;
var myFollow = localStorage.getItem('riyan_follow') === 'yes';
var extra = parseInt(localStorage.getItem('riyan_extra') || '0');
async function loadFollowers(){ try{ let res = await fetch('https://api.countapi.xyz/get/riyan-ahmed-xtali/followers'); let data = await res.json(); if(data.value){ baseFollowers = data.value; } }catch(e){} updateFollowUI(); }
function updateFollowUI(){ var total = baseFollowers + extra; document.getElementById('followCount').innerText = total.toLocaleString('en-IN'); var btn = document.getElementById('followBtn'); if(myFollow){ btn.innerText='✓ Following'; btn.classList.add('followed'); document.getElementById('followMsg').innerText='Thanks for following! ❤️'; } else { btn.innerText='+ Follow'; btn.classList.remove('followed'); document.getElementById('followMsg').innerText=''; } }
async function doFollow(){ if(!myFollow){ myFollow=true; extra++; localStorage.setItem('riyan_follow','yes'); localStorage.setItem('riyan_extra', extra); try{ await fetch('https://api.countapi.xyz/hit/riyan-ahmed-xtali/followers'); }catch(e){} updateFollowUI(); } else { myFollow=false; extra=Math.max(0,extra-1); localStorage.setItem('riyan_follow','no'); localStorage.setItem('riyan_extra', extra); updateFollowUI(); } }
loadFollowers(); updateFollowUI();
